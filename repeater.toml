
[identity]
initial_ids = ["default_voice"]
pending_ids = ["default_voice"]
mandatory_ids = ["default_cw"]
ct_message = "yellow_jacket"
timeout_message = "timeout_warn"

[timers]
tail = 2.5
hang = 5.0
kerchunk = 0.0
timeout = 180.0
id_interval = 600.0
id_pending = 60.0

[audio]
morse_wpm = 20
morse_pitch = 700
morse_volume = 90
voice_volume = 90
repeat_gain = 1.0
voice_blocks_repeat = false
sample_rate = 16000

[hardware]
mock = false
ptt_gpio = 17
cos_gpio = 27
cos_invert = true

[ctcss]
mode = "ste reverse_burst"
access_mode = "cos_ctcss"
encode_freq = 91.5
decode_freq = 91.5
encode_level = 0.15
ste_mode = "reverse"
chicken_burst_ms = 200
reverse_burst_ms = 250
decode_time_ms = 250
decode_threshold = 0.015
decode_hold_ms = 500

[courtesy_tones.default]
elements = [[1000, 0, 50, 0.8], [0, 0, 30, 0.0], [1200, 0, 50, 0.8]]

[courtesy_tones.single]
elements = [[1000, 0, 80, 0.8]]

