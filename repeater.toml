  {type = "voice", clip = "SIX"},
  {type = "voice", clip = "FIVE"},
  {type = "voice", clip = "G"},
  {type = "voice", clip = "M"},
  {type = "voice", clip = "R"},
  {type = "voice", clip = "S"},
  {type = "voice", clip = "REPEATER"},
