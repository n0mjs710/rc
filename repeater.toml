
[daemon]
socket_path = "/run/rc/rc.sock"
log_level = "INFO"

[hardware]
hidraw_device = ""     # leave empty for auto-detect by USB VID 0x0d8c
audio_device  = ""     # leave empty for system default audio device

[audio]
sample_rate         = 16000
rx_hpf              = true    # 300 Hz high-pass on RX (removes CTCSS/hum)
rx_deemphasis       = true    # FM de-emphasis on RX audio
tx_preemphasis      = false   # FM pre-emphasis on TX mix
repeat_gain         = 1.0     # RX passthrough gain (1.0 = unity)
morse_wpm           = 20
morse_pitch         = 700
morse_level         = 0.9
voice_level         = 0.9
voice_blocks_repeat = false   # mute RX passthrough while VOICE clips play

[ctcss]
access_mode = "cor_ctcss"   # "cor" (COR alone) or "cor_ctcss" (both required)

[timers]
hang        = 2.5     # s — hang time: PTT holdoff after CT (how long before TX "hangs up")
ct_delay    = 0.5     # s — delay from RX stream loss to courtesy tone
kerchunk    = 0.5     # s — minimum COR hold to respond (anti-kerchunk)
timeout     = 180.0   # s — time-out timer (TOT) transmit cutoff
id_interval = 600.0   # s — mandatory ID interval (FCC ≤ 10 min)
id_pending  = 60.0    # s — queue pending ID this far before deadline

[identity]
callsign      = "WA0EDA"
initial_ids   = ["default_voice"]
pending_ids   = ["default_voice"]
mandatory_ids = ["default_cw"]
ct_message    = "yellow_jacket"
timeout_message = "timeout_warn"

[courtesy_tones.default]
elements = [[1000, 0, 50, 0.8], [0, 0, 30, 0.0], [1200, 0, 50, 0.8]]

[courtesy_tones.single]
elements = [[1000, 0, 80, 0.8]]

[courtesy_tones.triple]
elements = [[800, 0, 40, 0.8], [0, 0, 20, 0.0], [1000, 0, 40, 0.8], [0, 0, 20, 0.0], [1200, 0, 40, 0.8]]

[courtesy_tones.K]
elements = [[700, 0, 180, 0.8], [0, 0, 60, 0.0], [700, 0, 60, 0.8], [0, 0, 60, 0.0], [700, 0, 180, 0.8]]

[courtesy_tones.chord]
elements = [[697, 1209, 150, 0.75]]

[courtesy_tones.timeout_warn]
elements = [[1200, 0, 60, 0.9], [0, 0, 20, 0.0], [1000, 0, 60, 0.9], [0, 0, 20, 0.0], [800, 0, 60, 0.9]]

[courtesy_tones.id_pending]
elements = [[880, 0, 60, 0.6], [0, 0, 30, 0.0], [880, 0, 60, 0.6]]

[messages.default_cw]
elements = [{type = "cw", text = "WA0EDA/R"}]

[messages.timeout_warn]
elements = [
  {type = "tone", freq1 = 1200, freq2 = 0, ms = 60, amp = 0.9},
  {type = "tone", freq1 = 0,    freq2 = 0, ms = 20, amp = 0.0},
  {type = "tone", freq1 = 1000, freq2 = 0, ms = 60, amp = 0.9},
  {type = "tone", freq1 = 0,    freq2 = 0, ms = 20, amp = 0.0},
  {type = "tone", freq1 = 800,  freq2 = 0, ms = 60, amp = 0.9},
]

